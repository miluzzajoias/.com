<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Login | Miluzza Joias</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #4a0628;
      color: #3b3030;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: #fbf8f3;
      padding: 45px 32px;
      box-shadow: 0 25px 80px rgba(0,0,0,.22);
    }

    .logo {
      width: 170px;
      height: auto;
      display: block;
      margin: 0 auto 30px;
    }

    .eyebrow {
      text-align: center;
      color: #a88a58;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .18em;
    }

    h1 {
      margin: 12px 0 8px;
      text-align: center;
      color: #4a0628;
      font: 500 42px/1 Georgia, serif;
    }

    .subtitle {
      text-align: center;
      color: #756b68;
      font-size: 12px;
      margin: 0 0 28px;
    }

    label {
      display: block;
      margin-bottom: 16px;
      color: #4a0628;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    input {
      width: 100%;
      display: block;
      margin-top: 7px;
      padding: 14px;
      border: 1px solid #d9cdc5;
      background: #fff;
      outline: none;
      font-size: 13px;
    }

    input:focus {
      border-color: #a88a58;
      box-shadow: 0 0 0 2px rgba(168,138,88,.12);
    }

    button {
      width: 100%;
      border: 0;
      background: #4a0628;
      color: white;
      padding: 15px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      cursor: pointer;
      margin-top: 4px;
    }

    button:disabled {
      opacity: .55;
      cursor: wait;
    }

    #error {
      min-height: 20px;
      margin-top: 13px;
      color: #a21d4e;
      text-align: center;
      font-size: 11px;
      line-height: 1.5;
    }

    .back {
      display: block;
      margin-top: 24px;
      text-align: center;
      color: #4a0628;
      font-size: 11px;
      text-decoration: none;
    }

  </style>
</head>

<body>

  <main class="login-card">

    <img
      class="logo"
      src="../logo-local.svg"
      alt="Miluzza Joias"
    >

    <div class="eyebrow">
      ÁREA ADMINISTRATIVA
    </div>

    <h1>Bem-vinda.</h1>

    <p class="subtitle">
      Entre para administrar sua loja.
    </p>

    <form id="loginForm">

      <label>
        E-mail

        <input
          id="email"
          type="email"
          autocomplete="username"
          required
        >
      </label>

      <label>
        Senha

        <input
          id="password"
          type="password"
          autocomplete="current-password"
          required
        >
      </label>

      <button
        id="loginButton"
        type="submit"
      >
        Entrar no painel
      </button>

      <div id="error"></div>

    </form>

    <a
      class="back"
      href="../index.html"
    >
      ← Voltar para a loja
    </a>

  </main>


  <script type="module">

    import {
      auth,
      signInWithEmailAndPassword,
      signOut
    } from "../assets/js/firebase.js";


    const ADMIN_EMAIL =
      "miluzzajoias@gmail.com";


    const form =
      document.querySelector("#loginForm");

    const email =
      document.querySelector("#email");

    const password =
      document.querySelector("#password");

    const button =
      document.querySelector("#loginButton");

    const error =
      document.querySelector("#error");


    form.addEventListener(
      "submit",
      async event => {

        event.preventDefault();

        error.textContent = "";

        button.disabled = true;

        button.textContent =
          "Verificando...";


        try {

          const credential =
            await signInWithEmailAndPassword(
              auth,
              email.value.trim(),
              password.value
            );


          const user =
            credential.user;


          if (
            !user.email ||
            user.email.toLowerCase() !==
            ADMIN_EMAIL.toLowerCase()
          ) {

            await signOut(auth);

            throw new Error(
              "Esta conta não possui acesso administrativo."
            );

          }


          /*
           * O Firebase já confirmou a conta.
           * Agora abrimos o painel.
           */

          window.location.replace(
            "index.html"
          );

        }

        catch (err) {

          console.error(
            "Erro no login:",
            err
          );


          if (
            err.code ===
            "auth/invalid-credential"
          ) {

            error.textContent =
              "E-mail ou senha inválidos.";

          }

          else if (
            err.code ===
            "auth/user-not-found"
          ) {

            error.textContent =
              "Usuário não encontrado.";

          }

          else if (
            err.code ===
            "auth/wrong-password"
          ) {

            error.textContent =
              "Senha incorreta.";

          }

          else {

            error.textContent =
              err.message ||
              "Não foi possível entrar.";

          }


          button.disabled = false;

          button.textContent =
            "Entrar no painel";

        }

      }
    );

  </script>

</body>
</html>
